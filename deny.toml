# cargo-deny configuration. Run in CI per the engineering standards in
# .claude/CONTRACT.md.

[graph]
targets = [
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-apple-darwin" },
    { triple = "x86_64-unknown-linux-gnu" },
]

[advisories]
version = 2
ignore = [
    # `paste` is archived and unmaintained. It is a compile-time-only
    # proc-macro that pastes identifiers together, reached transitively through
    # the embedding stack; it executes no code at runtime and handles no
    # untrusted input, so "unmaintained" here is a supply-chain note rather
    # than a vulnerability. Revisit when fastembed drops it.
    "RUSTSEC-2024-0436",
]

[licenses]
version = 2
# Permissive licences only. This was written while Specline was unpublished, on the
# grounds that a copyleft dependency would foreclose publishing later and that
# finding out at publish time is expensive. That bet is now called: Specline is
# Apache-2.0 and public, so the list is load-bearing rather than precautionary.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "Unlicense",
    "BSL-1.0",
    # The Mozilla root certificate bundle (webpki-roots), reached through the
    # embedding model download path. A permissive data licence, not copyleft.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

# `private = { ignore = true }` used to sit here, so that cargo-deny would not
# demand an SPDX expression for Specline's own crates while they had none. The
# instruction attached to it was "if Specline is ever published, choose a licence
# and delete this", and that is what happened: the workspace declares
# `license = "Apache-2.0"`, so its crates are checked against the allow list
# above like everything else. Deleting the exemption is the point — it means a
# future crate that forgets its licence fails here rather than passing quietly.

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
