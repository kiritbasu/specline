name: Release

# This workflow is written by hand, not produced by `dist generate`, and
# `dist-workspace.toml` sets `allow-dirty = ["ci"]` so that a regeneration does
# not quietly replace it. The reason is the Node step below: the daemon embeds
# the built site from `apps/desktop`, and a generated workflow has no way to
# know that, so it would produce a daemon that starts, serves nothing, and looks
# healthy. See PHASE-10 §3 and §10.
#
# It follows the shape of the workflow `dist` generates — build the per-target
# artifacts on their native runners, then build the installer once from the
# collected results — and calls `dist` for both. It does not call `dist host`;
# the release is created with `gh`, which is one fewer moving part to be wrong
# about, at the cost of not merging the per-target manifests.

on:
  push:
    tags:
      # A pushed tag is the only way to start a release, so a release always
      # leaves a permanent mark in the repository (§13: "a release is one CI run
      # and produces every target").
      #
      # These are ref *glob* filters, not regexes: `v0.1.0` and `v0.1.0-rc.1`
      # match, `v0.1` and `v0.1.0-notes`... also matches the second pattern, so
      # the prerelease detection in the publish job is what keeps an rc out of
      # `latest` rather than this filter.
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  # Create the release and upload the assets.
  contents: write
  # The two below are what `actions/attest-build-provenance` needs to mint a
  # signed statement about the artifacts. Without `id-token: write` it fails at
  # the end of a successful build, which is an expensive way to find out.
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Pinned to match `dist-workspace.toml`'s `cargo-dist-version`. If the two
  # disagree, `dist` warns and the artifact is not the one that was configured.
  DIST_VERSION: "0.32.0"

jobs:
  build:
    name: build ${{ matrix.target }}
    # `fromJSON` because one leg needs a label *list* and the other a single
    # label, and `runs-on` will not take a bare string where an array is meant.
    # Carrying both as JSON in the matrix is the documented way to mix them.
    runs-on: ${{ fromJSON(matrix.runner) }}
    strategy:
      # One platform failing should not hide the result on the other two. A
      # release is all-or-nothing, but the diagnosis is much cheaper when every
      # leg has reported.
      fail-fast: false
      matrix:
        include:
          # **macOS builds are linked by Apple's toolchain and never
          # cross-compiled from Linux.** On Apple Silicon an executable must
          # carry at least an ad-hoc signature or the kernel kills the process
          # at exec. Apple's linker adds one; a binary cross-compiled from Linux
          # does not carry one and dies on every M-series Mac. The failure looks
          # exactly like a corrupt download — no diagnostic, no signature
          # message, just a killed process — so it would be blamed on the
          # installer or the network long before anyone suspected the linker.
          #
          # Both macOS targets build on **one self-hosted Apple Silicon Mac**
          # (B-72). The requirement is Apple's linker, not GitHub's hardware,
          # and `--target=x86_64-apple-darwin` on an arm64 host still links with
          # `cc` and still gets the ad-hoc signature. §10 had already planned
          # this shape for when GitHub retires the Intel runners in August 2027;
          # the repository staying private brought it forward, because hosted
          # macOS minutes are billed at ten times the Linux rate there and the
          # alternative was publishing the repository to get them free.
          #
          # Labels are the three a macOS arm64 runner assigns itself on
          # registration, so there is nothing to remember to set. **A job with
          # no matching runner queues; it does not fail.** A sleeping Mac looks
          # like a run that never starts.
          - target: aarch64-apple-darwin
            runner: '["self-hosted", "macOS", "ARM64"]'
          # Intel macOS and Linux were removed when 0.1.0 was cut, because both
          # failed on `ort-sys` — the ONNX Runtime binding `fastembed` pulls in.
          # `ort` downloads a prebuilt static library rather than compiling one,
          # so ONNX decided which platforms could link: no Intel macOS prebuilt
          # exists at all, and the Linux one wants glibc 2.38 against a runner
          # deliberately pinned to 2.35 to keep the floor low.
          #
          # **They are back because the dependency is gone from the release
          # build**, not because anything about ONNX changed:
          # `[package.metadata.dist] default-features = false` builds every
          # target without embeddings (KEEL-220, KEEL-252). The cost is that no
          # released binary can do semantic search; `specline doctor` says so.
          #
          # Intel macOS builds on the same self-hosted Apple Silicon Mac.
          # `--target=x86_64-apple-darwin` on an arm64 host still links with
          # `cc` and still gets the ad-hoc signature, which is the requirement —
          # Apple's linker, not Apple's hardware.
          - target: x86_64-apple-darwin
            runner: '["self-hosted", "macOS", "ARM64"]'
          # `ubuntu-22.04`, never `ubuntu-latest`. The glibc a binary links
          # against is a floor rather than a preference: built on a newer image
          # it refuses to start on anything older, with a message that reads
          # like a corrupt download.
          - target: x86_64-unknown-linux-gnu
            runner: '"ubuntu-22.04"'
    steps:
      - uses: actions/checkout@v7

      # A self-hosted runner keeps its working directory between jobs, so
      # `target/distrib` still holds whatever the previous target produced.
      # `upload-artifact` globs that directory, so without this each macOS job
      # would upload the other one's archives too. Harmless when the contents
      # agree and quietly wrong when they do not — a re-run after a failed
      # build would ship a stale archive alongside a fresh one.
      #
      # `checkout` cleans tracked files; `target/` is ignored, so it does not.
      - name: Clear the previous run's artifacts
        shell: bash
        run: rm -rf target/distrib

      # `rust-toolchain.toml` pins the version, so rustup installs it on demand
      # and this only has to add the target. On the self-hosted runner that is
      # a no-op after the first release.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Hosted runners start empty and need the cache. The self-hosted one
      # keeps `target/` between runs, so restoring a cache over the top buys
      # nothing and spends GitHub's cache storage on gigabytes it already has
      # on disk.
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          key: ${{ matrix.target }}

      # --- The site the daemon embeds ---------------------------------------
      #
      # `specline-daemon` serves the React app from `apps/desktop` compiled into the
      # binary, so `apps/desktop/dist` must exist before cargo runs. `dist` has
      # no idea this dependency exists and will not do it; a build without these
      # three steps still succeeds and still produces a working MCP server,
      # which is why it needs saying here rather than being left to fail loudly.
      #
      # `npm run build` is `tsc --noEmit && vite build` — a type error fails the
      # release, which is the right moment for it to.
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install the site's dependencies
        # `ci`, not `install`: it installs exactly the lockfile and fails if
        # `package.json` and `package-lock.json` disagree, rather than resolving
        # something that was never tested.
        run: npm ci --prefix apps/desktop

      - name: Build the site
        run: npm run build --prefix apps/desktop

      # --- The binaries ------------------------------------------------------

      # Two ways in, chosen by what kind of machine this is.
      #
      # A hosted runner is a throwaway VM, so piping the upstream installer into
      # `sh` costs nothing that matters and takes seconds. A self-hosted runner
      # is somebody's actual Mac, and running an unreviewed downloaded script on
      # it every release is a different proposition — the more so because that
      # script is the one whose checksum verification this repository patches
      # (see `scripts/patch-installer.sh`). There, `cargo install --locked` goes
      # through crates.io with a lockfile instead, and re-running it when the
      # version already matches is a no-op rather than a rebuild.
      - name: Install dist
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(dist --version 2>/dev/null | awk '{print $2}')" = "$DIST_VERSION" ]; then
            echo "dist $DIST_VERSION already present"
          elif [ "$RUNNER_ENVIRONMENT" = "self-hosted" ]; then
            cargo install cargo-dist --version "$DIST_VERSION" --locked
          else
            # `--proto '=https' --tlsv1.2` stop a redirect downgrading the
            # transfer to plaintext; `-f` makes curl fail on an HTTP error
            # instead of piping an error page into sh.
            #
            # The asset is still named `cargo-dist-installer.sh` at 0.32.0
            # despite the tool having renamed itself to `dist` — checked against
            # the release, not assumed. A 404 here means that changed.
            curl --proto '=https' --tlsv1.2 -LsSf \
              "https://github.com/axodotdev/cargo-dist/releases/download/v${DIST_VERSION}/cargo-dist-installer.sh" | sh
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # `--artifacts=local` is this target's binaries, archives and checksums.
      # The installer is a global artifact and is built once, in the publish
      # job, from all three targets' results.
      #
      # **The manifest this writes is how the checksum reaches the installer,
      # and leaving it out is what shipped 0.1.2 unverified** (KEEL-228).
      # `dist` computes an archive's digest in the job that builds the archive
      # and records it in that job's manifest. The publish job then merges every
      # `*dist-manifest.json` it finds in `target/distrib` and fills the digests
      # into the installer it generates. With no manifest to merge, `dist` emits
      # an installer with no `_checksum_style` at all — which is not an error, is
      # not warned about, and installs anyway. The header of this file already
      # noted that not calling `dist host` costs us "merging the per-target
      # manifests"; this is what that cost was.
      #
      # Written outside `target/distrib` and copied in afterwards, deliberately.
      # The shell creates the redirect target before `dist` runs, and `dist`
      # reads every `*dist-manifest.json` in the dist dir on startup — pointing
      # the redirect straight at that directory hands it an empty file to parse.
      - name: Build the artifacts for this target
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          dist build \
            --tag="${GITHUB_REF_NAME}" \
            --target="${{ matrix.target }}" \
            --artifacts=local \
            --output-format=json \
            > "$work/dist-manifest.json"
          cat "$work/dist-manifest.json"
          cp "$work/dist-manifest.json" \
            "target/distrib/${{ matrix.target }}-dist-manifest.json"

      # What this release promises, read out of the binary that is actually
      # being shipped. The updater has to decide whether a candidate is safe to
      # apply *before* downloading it, and it cannot ask the candidate — running
      # the thing you are deciding whether to run is the whole problem (KEEL-202).
      # `release-manifest` opens no store, so it runs on a machine with no Specline
      # home at all, which is what this is.
      #
      # Extracted from the archive rather than guessed at under `target/`: the
      # archive layout is a published contract, and its internal directory is
      # named for the target. Checked against the real v0.1.1 asset rather than
      # assumed — `specline-aarch64-apple-darwin/specline`.
      #
      # Only the host's own target can be executed here, which is why this sits
      # in the per-target job and not in `publish`: that job runs on Linux and
      # every artifact it holds is a macOS binary. With one macOS target on a
      # macOS runner the condition always holds; when Linux returns, its leg
      # writes the same file with the same contents and `download-artifact`'s
      # merge collapses the two. The values here are target-independent —
      # version, schema, protocol — so two legs cannot disagree about them.
      #
      # Checksums are deliberately absent at this stage. They belong to the
      # release rather than to the binary, and `publish` is the only place that
      # has every artifact in one directory.
      - name: Record what this release promises
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          tar -xJf "target/distrib/specline-${{ matrix.target }}.tar.xz" -C "$work"
          "$work/specline-${{ matrix.target }}/specline" release-manifest \
            > target/distrib/specline-release.json
          cat target/distrib/specline-release.json

      - uses: actions/upload-artifact@v7
        with:
          name: artifacts-${{ matrix.target }}
          path: target/distrib/*
          # An empty upload here would produce a release with a working-looking
          # installer pointing at archives that do not exist. Fail instead.
          if-no-files-found: error

  publish:
    name: installer, attestations and release
    needs: build
    runs-on: ubuntu-latest
    steps:
      # `dist` reads the workspace to build the installer, so the source has to
      # be here even though nothing is compiled in this job. No Node either: the
      # embedded site is already inside the binaries downloaded below.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          merge-multiple: true
          path: target/distrib

      - name: Install dist
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/axodotdev/cargo-dist/releases/download/v${DIST_VERSION}/cargo-dist-installer.sh" | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build the installer
        shell: bash
        run: |
          set -euo pipefail
          # Global artifacts are the shell installer and anything else that
          # spans targets. It embeds the checksums of the local artifacts, which
          # is why this runs after the download and not in parallel with it —
          # and the checksums arrive in the `*-dist-manifest.json` files the
          # build jobs wrote, which `dist` merges out of this directory on
          # startup. Downloading the archives without their manifests produces
          # an installer that verifies nothing, quietly. That is KEEL-228, and
          # the step below is what now refuses to publish it.
          dist build --tag="${GITHUB_REF_NAME}" --artifacts=global

      # Before the attestation, deliberately: the statement has to be about the
      # bytes people download, and those are the patched ones. Attesting first
      # would produce a signed claim about a file that no longer exists.
      #
      # The script exits non-zero if the block it rewrites is not there, which
      # fails the release. That is the intended behaviour — see its header. An
      # installer whose checksum path has not been checked is exactly the thing
      # this step exists to stop shipping.
      - name: Make the installer verify what it downloads
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/patch-installer.sh target/distrib/*.sh

      # And then prove it, rather than trusting the step above to have been
      # about the right hole.
      #
      # `patch-installer.sh` passed on the 0.1.2 release and the installer still
      # shipped verifying nothing: it was fixing the digest-tool fallback while
      # the checksum value itself was empty. So this reads the hex out of the
      # installer, hashes the archive about to be uploaded, and compares. It
      # cannot be satisfied by wording, and a release whose installer would
      # print "no checksums to verify" fails here instead of on somebody's
      # machine.
      - name: Prove the installer carries the checksums of what it downloads
        shell: bash
        run: |
          set -euo pipefail
          for installer in target/distrib/*installer.sh; do
            ./scripts/check-installer-checksums.sh "$installer" target/distrib
          done

      # Skipped while the repository is private, because GitHub will not do it:
      #
      #   Failed to persist attestation: Feature not available for user-owned
      #   private repositories. To enable this feature, please make this
      #   repository public.
      #
      # That is a straight consequence of B-72, which chose private, and it was
      # not anticipated there — attestations and privacy are simply not both
      # available on a user-owned repository. When the repository goes public
      # this starts working again with no change here.
      #
      # Conditional rather than deleted, and conditional rather than
      # `continue-on-error`. Deleting it would lose provenance silently the day
      # the repository goes public; `continue-on-error` would print a red X on
      # every release for a thing that cannot work, which is how people learn to
      # ignore red. The release notes say provenance is absent, so the gap is
      # stated where somebody downloading the artifact would see it rather than
      # only in a workflow log.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v4
        with:
          # The archives and the installer — the two things a user actually
          # downloads, and so the two things `gh attestation verify` should be
          # able to speak about. `*.tar.*` rather than a fixed `.tar.xz` so that
          # setting `unix-archive` in `dist-workspace.toml` later does not
          # silently stop attesting anything.
          subject-path: |
            target/distrib/*.tar.*
            target/distrib/*.sh

      # The manifest is the updater's trust root, so it has to carry the hash of
      # every file this release publishes. B-73: with the repository private
      # there is no build provenance to check, and a checksum arriving over the
      # same authenticated path as the artifact is the whole of the guarantee.
      #
      # After the installer patch, not before. `patch-installer.sh` rewrites the
      # installer's bytes, so a hash taken earlier would describe a file that no
      # longer exists — the same ordering trap the attestation step above is
      # careful about, and with a quieter failure, since a wrong hash here looks
      # like a corrupt download to whoever hits it.
      #
      # A missing manifest fails the release. It means no build leg produced one
      # and every updater would fall back to having nothing to compare against,
      # which is exactly the silence this file is meant not to ship.
      - name: Decide what the release carries
        shell: bash
        run: |
          set -euo pipefail

          # The upload set, written once and read by both steps below.
          #
          # It used to be `find target/distrib -maxdepth 1 -type f` in two
          # places, with a comment asking the second to stay in step with the
          # first. That published fourteen files, of which nothing downloads
          # nine: three `*-dist-manifest.json`, three `*.tar.xz.sha256`,
          # `sha256.sum`, and a `source.tar.gz` GitHub already attaches to
          # every tag by itself.
          #
          # The manifests are not junk — `dist` merges every one it finds in
          # `target/distrib` on startup, and that is where the installer's
          # embedded checksums come from (KEEL-228, when they were missing and
          # the installer shipped with nothing to verify). They are needed
          # *here*, during the build. They are not needed by anybody
          # downloading a release, and `plugin/scripts/setup.sh` pulls the
          # whole release with `--pattern '*'`, so every one of them was a file
          # somebody's install waited for.
          #
          # Per-file `.sha256` sidecars go for the same reason: the updater
          # verifies against `specline-release.json`, which carries every
          # digest in one file, and the installer carries its own.
          # Absolute paths, so neither reader has to care what directory it
          # is standing in. The manifest step runs from inside `target/distrib`
          # and the publish step from the workspace root.
          dir="$GITHUB_WORKSPACE/target/distrib"
          list="$RUNNER_TEMP/release-files.txt"
          : > "$list"

          # The uninstall script rides along, named to match the installer.
          #
          # `dist` does not know about it — it is ours, not a build artifact —
          # so it is copied in here rather than produced. It has to be *in* the
          # release because the alternative is the README telling people to run
          # a path only a clone has, and most installs are a download. It lands
          # in the manifest with everything else, so it can be checksum-checked
          # before being run exactly like the installer can.
          cp "$GITHUB_WORKSPACE/plugin/scripts/uninstall.sh" \
             "$dir/specline-uninstall.sh"

          # `*.tar.*` rather than `*.tar.xz`, deliberately: `unix-archive` is
          # unset in `dist-workspace.toml`, so the extension is a default that
          # could move, and a fixed one here would silently stop uploading the
          # archives the day it did. The `.sha256` sidecars beside them are
          # what this filter is actually excluding.
          for f in "$dir"/specline-installer.sh "$dir"/specline-uninstall.sh \
                   "$dir"/specline-release.json "$dir"/specline-*.tar.*; do
            [ -f "$f" ] || continue
            case "$f" in *.sha256) continue ;; esac
            printf '%s\n' "$f" >> "$list"
          done

          # An archive missing here is a platform silently absent from the
          # release, which reads to a downloader as "not supported yet" rather
          # than as a broken build.
          archives="$(grep -c '/specline-[^/]*\.tar\.' "$list" || true)"
          if [ "$archives" -ne 3 ]; then
            echo "expected 3 archives in the release, found $archives:" >&2
            cat "$list" >&2
            exit 1
          fi
          cat "$list"

      - name: Put the artifact checksums in the release manifest
        shell: bash
        run: |
          set -euo pipefail
          cd target/distrib

          if [ ! -f specline-release.json ]; then
            echo "no specline-release.json — no build leg produced one, so this" >&2
            echo "release would ship with nothing for the updater to verify" >&2
            exit 1
          fi

          # Every file about to be uploaded except the manifest, which cannot
          # state its own hash. Read from the list the step above wrote, so the
          # manifest describes exactly what the release carries — it used to
          # hash everything in the directory, and so published digests for nine
          # files nobody could download.
          work="$(mktemp)"
          cp specline-release.json "$work"
          while IFS= read -r file; do
            name="$(basename "$file")"
            [ "$name" = "specline-release.json" ] && continue
            sum="$(sha256sum "$file" | awk '{print $1}')"
            jq --arg n "$name" --arg s "$sum" '.artifacts[$n] = $s' "$work" > "$work.next"
            mv "$work.next" "$work"
          done < "$RUNNER_TEMP/release-files.txt"

          mv "$work" specline-release.json
          cat specline-release.json

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"

          args=(--title "$tag" --generate-notes --verify-tag)

          # What the release says it is, taken from the annotated tag.
          #
          # It used to be `--generate-notes` alone: a bulleted list of commit
          # subjects, which reads as a changelog for people who already know
          # the codebase and as noise for everybody else. The prose describing
          # a version already exists — it is the summary on that version's
          # release row in Specline — and the tag message is where it can reach
          # CI, since the runner cannot see the store.
          #
          # So the loop is: write the release row, tag with its summary, and
          # the tag is what GitHub publishes. The notes and the tag cannot
          # disagree, because they are the same bytes.
          #
          # `git fetch --tags` because checkout leaves the tag *ref* but the
          # annotated tag *object* carrying the message is not guaranteed to
          # be local, and reading it through `gh api` would need two calls and
          # a branch for lightweight tags.
          git fetch --force --tags --quiet origin || true

          # The tag must be *annotated*. `%(contents)` on a lightweight tag
          # silently falls through to the commit it points at, so a `git tag
          # v0.5.0` with no `-a` would publish the last commit's subject as the
          # release notes — wrong, and wrong in the way nobody checks. Measured:
          # a lightweight tag on a repo whose only commit was "init" produced
          # notes reading "init".
          if [ "$(git cat-file -t "$tag" 2>/dev/null || true)" != "tag" ]; then
            echo "$tag is a lightweight tag, so it carries no message of its own" >&2
            echo "and this release would publish the commit subject as its notes." >&2
            echo "Cut it with: git tag -a $tag -F -" >&2
            exit 1
          fi

          notes="$(git tag -l --format='%(contents)' "$tag")"

          # And it must actually say something. `git tag -a -m ""` is annotated
          # and empty, which would pass the check above.
          if [ -z "${notes//[[:space:]]/}" ]; then
            echo "the tag $tag carries an empty message, so this release would" >&2
            echo "ship with nothing but a list of commit subjects. Tag with the" >&2
            echo "release row's summary." >&2
            exit 1
          fi

          # A prerelease must not become `latest`. The standalone install line
          # in §1 fetches `.../releases/latest/download/specline-installer.sh`, so
          # an rc landing there would become the default download for everyone
          # who is not reading release notes.
          case "$tag" in
            *-*) args+=(--prerelease) ;;
          esac

          # The list the "Decide what the release carries" step wrote, which is
          # also what the manifest hashed. One definition, so the release and
          # the manifest describing it cannot drift apart.
          mapfile -t files < "$RUNNER_TEMP/release-files.txt"
          if [ "${#files[@]}" -eq 0 ]; then
            echo "nothing to upload — refusing to create an empty release" >&2
            exit 1
          fi

          # Say what this release does *not* carry, on the release itself.
          #
          # A missing guarantee that is only missing in a workflow log is a
          # guarantee people assume they have. Whoever downloads this should be
          # able to see that `gh attestation verify` will not recognise these
          # files, and why, without going looking for it.
          #
          # Built with printf rather than a heredoc: a heredoc terminator inside
          # a YAML block scalar has to sit at column zero, which is a rule that
          # quietly stops holding the first time somebody re-indents this step.
          if [ "${{ github.event.repository.private }}" = "true" ]; then
            notes="$(printf '%s\n' \
              "$notes" \
              '' \
              '---' \
              '' \
              '> **No build provenance on this release.** GitHub does not offer artifact' \
              '> attestations for user-owned private repositories, so `gh attestation verify`' \
              '> will not recognise these files. The checksums embedded in the installer are' \
              '> still verified on download. Attestations resume on their own if this' \
              '> repository is ever made public.')"
          fi

          # The caveat goes *under* the prose now rather than above it. It is a
          # footnote about how the files were built, and it was the first thing
          # anybody opening a release read.
          args+=(--notes "$notes")

          gh release create "$tag" "${args[@]}" "${files[@]}"
