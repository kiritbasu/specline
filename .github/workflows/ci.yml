name: CI

on:
  push:
    # Both names. This repository's trunk is `master` and the trigger said
    # `main`, so a push to trunk would not have started anything even once
    # there is a remote to push to. Listing both costs nothing and removes a
    # way for CI to be silently absent.
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  # Sunday morning, for the discovery jobs at the bottom of this file. They are
  # too slow to sit in front of a merge and their output is something to read
  # rather than something to satisfy.
  schedule:
    - cron: "0 6 * * 0"

# Read and nothing else. This matches the repository's default today, and
# stating it here means a change to that default cannot quietly hand a token
# with write access to every job in this file — including the ones that build a
# pull request's code.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # One gate, two platforms, two jobs. It was a matrix until the repository went
  # public, and the thing a matrix could not express is the reason it is not one
  # any more — see the macOS job below.
  #
  # The steps themselves live in `.github/actions/rust-check`, so the two cannot
  # drift apart.
  check-linux:
    name: fmt · clippy · test (linux)
    runs-on: ubuntu-latest
    env:
      # The suite runs on a machine that may have a real store and a live daemon
      # on it, which the hosted runners never had. Anything reaching for the
      # default home would find `~/.specline` — KEEL-186 is that exact class of bug,
      # and a test suite is the worst place to discover another one.
      #
      # Costs nothing on a hosted runner, where it is a directory that did not
      # exist either way, and on the self-hosted one it is the difference
      # between a test run and an incident.
      SPECLINE_HOME: ${{ github.workspace }}/.ci-specline-home
    steps:
      # Linux is not decoration. This is a local-first SQLite tool, and the two
      # things most likely to differ between platforms are the two it depends on
      # most: file locking, and path handling. The path-traversal finding that
      # produced `safe_path` was in exactly that area, and it was only ever
      # exercised on macOS.
      #
      # Hosted, and it stays hosted: it is billed at the base rate, and it is
      # the only check in this repository that runs on a machine nobody develops
      # on. It is also the only leg a fork's pull request gets, which makes it
      # the one that has to be reliable.
      - uses: actions/checkout@v7
      # The Linux leg also refuses unreferenced snapshot files (KEEL-410),
      # which is a property of the repository and needs checking only once.
      - uses: ./.github/actions/rust-check
        with:
          snapshots: "true"

  check-macos:
    name: fmt · clippy · test (macos)
    runs-on: ["self-hosted", "macOS", "ARM64"]
    # **A fork's pull request never reaches the self-hosted runner.**
    #
    # That runner is a personal laptop with the author's own files on it, and a
    # pull request is arbitrary code — a build script, a test, a dependency's
    # `build.rs`. While the repository was private the population able to open
    # one was "nobody", so naming a self-hosted runner cost nothing to think
    # about. It is public now and that population is "anyone".
    #
    # GitHub's fork-PR approval policy requires a click for every outside
    # contributor, which helps and is not enough on its own: it makes a
    # dangerous default survivable by asking a human to be careful every time,
    # and the argument this codebase makes everywhere else is that a safety
    # mechanism depending on somebody remembering is not one.
    #
    # So a fork's pull request gets Linux and nothing else. macOS coverage
    # arrives with the push build once the change is on main — later than ideal,
    # and the right trade against running a stranger's code on your own machine.
    #
    # This condition is why the two platforms are two jobs rather than a matrix:
    # a job-level `if` can read `github` and cannot read `matrix`.
    # Dependabot is excluded for a second reason, learned the hard way: its
    # branches live *in* this repository, so the fork test above passes and
    # eleven dependency bumps queued eleven cold Rust builds on the laptop at
    # once. A dependency bump is also code somebody else wrote, arriving
    # unattended and on a schedule — which is the same argument as the fork one
    # with the volume turned up. Linux covers them; macOS covers the merge.
    if: >-
      github.actor != 'dependabot[bot]'
      && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository)
    env:
      SPECLINE_HOME: ${{ github.workspace }}/.ci-specline-home
    steps:
      # macOS moved to the self-hosted runner with the release build (B-72):
      # hosted macOS minutes are billed at ten times the Linux rate, and CI runs
      # on every push.
      #
      # **A job with no runner queues rather than failing.** If this sits at
      # "waiting for a runner", the Mac is asleep.
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-check

  # The configuration two of the three release targets ship, run so that it is
  # not the one nobody tests.
  #
  # A feature that changes what a build *can do* creates a second product, and
  # the ordinary `cargo test` covers exactly one of them. Without this leg, the
  # binary an Intel Mac or a Linux box installs would be the configuration with
  # no coverage at all — which is the shape of mistake the definition of done
  # dropped `--all-features` to avoid, arriving from the other direction
  # (KEEL-220).
  #
  # Linux and hosted, because it is cheap and because this is exactly the
  # platform the configuration exists for.
  check-no-embeddings:
    name: fmt · clippy · test (no embeddings)
    runs-on: ubuntu-latest
    env:
      SPECLINE_HOME: ${{ github.workspace }}/.ci-specline-home
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # `--exclude specline-embed`, and it is the whole trick rather than a detail.
      # `specline-embed` is a workspace member, so `--workspace` builds it directly
      # no matter what features anything else asked for — and building it *is*
      # building the ONNX runtime. Without the exclusion this leg would link the
      # thing it exists to prove is absent, and fail on the one platform that
      # cannot link it. The same applies to a Linux developer's `cargo build
      # --workspace`; CONTRIBUTING.md says so.
      - name: Clippy
        run: cargo clippy --workspace --exclude specline-embed --all-targets --no-default-features -- -D warnings

      - name: Test
        run: cargo test --workspace --exclude specline-embed --no-default-features

      # The point of the whole exercise, asserted rather than assumed: the ONNX
      # runtime is out of the graph, so the targets that cannot link it can be
      # built. A green test suite would not notice `ort` still being pulled in.
      - name: The ONNX runtime is not in this build
        run: |
          if cargo tree -p specline --no-default-features -e normal | grep -qE 'fastembed|ort v'; then
            echo "::error::fastembed or ort is still in the dependency graph without the embeddings feature"
            cargo tree -p specline --no-default-features -e normal | grep -E 'fastembed|ort v'
            exit 1
          fi
          echo "no fastembed, no ort"

  deny:
    name: licences · advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # --- Discovery, not gates -------------------------------------------------
  #
  # Everything below is scheduled and non-blocking, deliberately. At one
  # developer a coverage threshold that fails a PR is a number people learn to
  # satisfy rather than a question they answer, and mutation testing is far too
  # slow to sit in front of a merge. These run weekly and publish artifacts to
  # read, which is the useful shape: they are for finding holes, not for
  # refusing work.

  coverage:
    name: coverage (reported, not enforced)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Measure
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Summarise
        run: cargo llvm-cov report --summary-only | tee coverage-summary.txt

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            lcov.info
            coverage-summary.txt

  # The mutation-testing job was here, and it has been taken out rather than
  # disabled. It ran weekly against graph.rs, next.rs, safe_path.rs and id.rs,
  # ended in `|| true` so it could never fail a build, and took two hours and
  # thirteen minutes for those four files.
  #
  # It was removed because it had done its job and nobody had read the answer.
  # The one run that finished found twelve mutations the suite did not catch —
  # two of them in the ready/blocked ranking, where a wrong result is
  # indistinguishable from a real one — and those sat unread in an artifact for
  # two days. A weekly report nobody opens is not a safety net; it is a bill.
  #
  # The twelve are KEEL-214, which is where the value went. Bring the job back
  # when that is closed and there is traction worth protecting, and prefer
  # running it by hand against the files a change actually touched:
  #
  #   cargo mutants --no-shuffle -j 2 --file <the file you changed>
  #
  # Commented history is not kept here on purpose. `git log` has the job, and a
  # block of dead YAML is the kind of thing that gets uncommented years later
  # by someone who does not know why it was switched off.

  fuzz:
    name: fuzz smoke (60s per target)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Overrides `rust-toolchain.toml`, which pins the rest of the workspace to a
    # release. Without this the pin would win here too and cargo-fuzz would be
    # handed a stable compiler, where `-Z sanitizer=address` does not exist —
    # so the job would fail for a reason that has nothing to do with fuzzing.
    #
    # `RUSTUP_TOOLCHAIN` rather than `cargo +nightly` on each line: it covers
    # `cargo fuzz`'s own inner invocations too, which is where the pin would
    # otherwise reassert itself.
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v7
      # cargo-fuzz needs nightly: libFuzzer arrives through
      # `-Z sanitizer=address`, which is not on stable.
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      # Sixty seconds each. Not enough to prove anything, and that is fine —
      # these three parse untrusted strings, and the question a smoke run
      # answers is "does any input panic", which a minute of random bytes is
      # surprisingly good at. A long campaign would belong in its own workflow
      # with a corpus that persists between runs.
      - name: Smoke each target
        run: |
          # The target triple has to be named, and the reason is not obvious.
          #
          # `install-action` has no recipe for cargo-fuzz, so it falls back to
          # cargo-binstall, which fetches a *musl-linked* build. cargo-fuzz then
          # takes its default `--target` from its own binary's triple, so it
          # tried to build the fuzz targets for x86_64-unknown-linux-musl on a
          # gnu runner. Two errors follow: musl links libc statically and ASan
          # refuses that outright, and the musl std is not installed so `core`
          # cannot be found either.
          #
          # Asking rustc for the host rather than hard-coding it keeps this
          # working if the runner image ever changes architecture.
          host=$(rustc -vV | awk '/^host:/{print $2}')
          echo "fuzzing for $host"
          for name in confine_path fts_query parse_id; do
            cargo fuzz run --target "$host" "$name" -- -max_total_time=60
          done

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
