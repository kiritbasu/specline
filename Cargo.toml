[workspace]
resolver = "3"
# The Tauri app is excluded on purpose: it drags in a large native dependency
# tree, and building a webview on every `cargo test --workspace` would make the
# fast feedback loop slow for no benefit. It is also suspended as of
# 2026-08-10 — the web build is the surface under development, and the shell's
# build script refuses to run without SPECLINE_DESKTOP=1. See its build.rs.
exclude = ["apps/desktop/src-tauri"]
members = [
    "crates/specline-core",
    "crates/specline-embed",
    "crates/specline-daemon",
    "crates/specline-update",
    "crates/specline-mcp",
    "crates/specline",
]

[workspace.package]
version = "0.5.1"
edition = "2024"
rust-version = "1.89"
authors = ["KB"]
# `dist` refuses to configure a GitHub release without it, and it is the right
# refusal: the installer bakes a download URL into itself, so a workspace that
# has not said where it lives would produce a script pointing nowhere. HTTPS,
# not SSH, for the reason in B-69 — key authentication is broken on the build
# machine.
repository = "https://github.com/kiritbasu/specline"
license = "Apache-2.0"
# Permissive, with the patent grant MIT lacks (B-65). The full text is in
# `LICENSE` at the repository root; this is the metadata copy, and `cargo deny`
# now checks the workspace crates against it like any other dependency —
# deny.toml's `private.ignore` came out when this went in.
#
# `publish = false` stays, and does not mean what it used to. It no longer says
# "this is nobody else's"; it says Specline is not a crates.io package. It is two
# binaries distributed as release artifacts, and a library nobody depends on
# externally, so the only thing `cargo publish` could do here is succeed by
# accident.
publish = false

[workspace.dependencies]
# Storage
# `bundled` compiles the SQLite amalgamation into the binary, which is what makes
# the release artifact one static file with no library to ship beside it and no
# version on the host that has to match. `sqlite-vec` is the vector index.
# `serde_json` is for the list columns: SQLite has no array type, so those are
# JSON in a TEXT column.
rusqlite = { version = "0.40", features = ["bundled", "chrono", "serde_json", "functions", "blob"] }
sqlite-vec = "0.1.9"

# Domain
ulid = { version = "3", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Errors and logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Content
similar = "3"
sha2 = "0.11"
# The daemon's per-request secret comes from the operating system, not from a
# clock or a counter (KEEL-238).
rand = "0.10"
base64 = "0.22"
# `default-features = false`, and the two features named back are the two
# defaults that are not an image pipeline. `image-models` is on by default and
# pulls `image`, which pulls `ravif`, which pulls `rav1e` — an AV1 *encoder*, in
# a workspace whose only use of this crate is turning 1,400 characters of
# English into 384 floats. It cost 3.4 GB of build tree and was the difference
# between a machine with room on it and a build that died with `No space left
# on device` (KEEL-348).
fastembed = { version = "6", default-features = false, features = [
    "ort-download-binaries-native-tls",
    "hf-hub-native-tls",
] }

# Daemon
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }
async-stream = "0.3"
futures-util = "0.3"
# The read surface, compiled into the daemon so a user needs no Node and no
# second process. `debug-embed` is deliberately absent: without it, debug builds
# read the files from disk at request time, which is what makes editing the site
# during development not require a `cargo build`.
rust-embed = { version = "8", features = ["mime-guess"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# Blocking HTTP for the CLI, which is synchronous and needs to talk to the
# daemon. `reqwest` would drag a tokio runtime into a process that has no other
# use for one.
# `tls` was absent until `specline update` arrived, and correctly so: every other
# call this crate makes is to `http://127.0.0.1:<port>`, so a TLS stack was
# weight for nothing. The updater fetches a release over HTTPS and is the first
# thing here to need one. Without it `ureq` compiles and fails at runtime with
# "no TLS backend is configured", which reads like a network fault rather than a
# missing feature — found by running the command rather than by reading this.
ureq = { version = "2", default-features = false, features = ["json", "tls"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Internal
specline-core = { path = "crates/specline-core", version = "0.5.1" }
specline-mcp = { path = "crates/specline-mcp", version = "0.5.1" }
specline-embed = { path = "crates/specline-embed", version = "0.5.1" }
# Checking for and installing a newer release. Depended on by both shipped
# binaries — see its own manifest for why it is not in `specline-core`.
specline-update = { path = "crates/specline-update", version = "0.5.1" }
# A library from the `specline` package's point of view: it holds the daemon, and
# the `specline-daemon` *binary* is a shim in `specline` so that one installer ships
# both executables. See `crates/specline/Cargo.toml`.
# `default-features = false` here rather than at the one call site, because
# Cargo will not let an inheriting member turn a workspace dependency's default
# features off. Only `specline` depends on this, and its own `embeddings` feature
# forwards to the daemon's — so the ordinary build is unchanged and
# `--no-default-features` reaches all the way down (KEEL-220).
specline-daemon = { path = "crates/specline-daemon", version = "0.5.1", default-features = false }

# Test-only
insta = { version = "1", features = ["json", "redactions", "filters"] }
proptest = "1"
tempfile = "3"

[workspace.lints.rust]
# `deny`, not `forbid`, since Phase 9. `sqlite-vec` is registered through
# SQLite's `sqlite3_auto_extension` hook, which takes a raw function pointer and
# is unsafe by construction — there is no safe wrapper in `rusqlite` and no way
# to load the extension without one. `forbid` exists precisely so that an
# `#[allow]` cannot override it, so keeping it would have meant no vector search
# rather than a tidy lint setting.
#
# The exception is one block, in `store::vector`, and it is the only
# `unsafe` in the workspace. Anything else that wants one has to argue for
# itself here first.
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
# The definition of done forbids these in library code. Making them lints rather
# than review discipline means CI catches them, not a human reading a diff.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
# A `MutexGuard<Store>` alive across an `.await` is two bugs at once. It can
# deadlock the runtime, and — the one nobody looks for — it pins a SQLite read
# snapshot for as long as the future is suspended, which stops the write-ahead
# log checkpointing past it. Everything keeps answering correctly from the log
# while the log grows without bound, which is this codebase's defining failure
# shape wearing a disk-space costume. The daemon runs for days, so "suspended"
# can mean a very long time.
#
# A lint rather than review discipline, because the failure is invisible at the
# call site: the code reads as an ordinary guard and an ordinary await.
await_holding_lock = "deny"

[profile.release]
lto = "thin"
codegen-units = 1

# The profile `dist` builds release artifacts with, and it has to exist or the
# release fails at the build step with `profile 'dist' is not defined` — which
# is exactly how it was found, by running `dist build` rather than by reading
# the configuration.
#
# `inherits = "release"` and nothing else, deliberately. The point of a separate
# profile is that a shipped binary and a locally built one can be tuned apart;
# nothing here needs them to differ yet, and a setting added now would be one
# nobody had measured. Keeping it empty means the artifact users get is built
# exactly the way `cargo build --release` builds it here, which is one fewer
# difference between what was tested and what ships.
[profile.dist]
inherits = "release"
