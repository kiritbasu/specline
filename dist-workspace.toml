# `dist` (formerly `cargo-dist`) — release packaging configuration.
#
# This lives here rather than in `Cargo.toml`'s `[workspace.metadata.dist]`
# because release plumbing and crate metadata change for unrelated reasons and
# should not contend for the same file. `dist` reads either; a
# `dist-workspace.toml` at the root takes precedence.
#
# Everything below is from PHASE-10 §10, which is the decision record. It was
# written before anyone had run `dist`, so several key names carried an
# "UNCERTAIN" note. KEEL-208 ran it. Every one is confirmed against
# `cargo-dist` 0.32.0's own `config::v0::DistMetadata`, and the notes are
# replaced by what was measured.
#
# **`dist` ignores keys it does not recognise, silently.** A junk key added to
# this file produced a clean `dist plan` with no warning, so "it did not
# complain" is not evidence a key is spelled right — every name here was checked
# against the struct field it deserialises into, and the two that change
# observable behaviour (`allow-dirty`, and the target list) were checked by
# removing them and watching something fail.

[workspace]
# The one Cargo workspace at the repository root. `apps/desktop/src-tauri` is
# excluded from that workspace already and is off the release path entirely
# (§3), so nothing here has to say so a second time.
members = ["cargo:."]

[dist]
# Pinned, never floating. The version that generates the installer is the
# version whose bugs are known — see the `sha256sum` note at the bottom of this
# file. A release that quietly picked up a newer `dist` would change the
# published artifact with nothing in the diff to say it had.
#
# The key kept its old name through the rename: the field is
# `cargo_dist_version` at 0.32.0. There is no `dist-version`.
cargo-dist-version = "0.32.0"

# GitHub Actions is the only backend. `.github/workflows/release.yml` is written
# by hand rather than generated — see `allow-dirty` below for why — but the
# backend still has to be declared so `dist` knows what shape of URL to bake
# into the installer.
ci = ["github"]

# One target, and the reason is measured rather than chosen.
#
# This said three until 0.1.0 was actually cut, at which point two of them
# failed and both failures were `ort-sys` — the ONNX Runtime binding `fastembed`
# pulls in. `ort` does not compile ONNX Runtime, it downloads a prebuilt static
# library, so the platforms Specline can ship to are the platforms that library is
# built for:
#
#   x86_64-apple-darwin        "no prebuilt binaries available for target"
#   x86_64-unknown-linux-gnu   needs glibc 2.38 and libstdc++ 13; the runner
#                              has 2.35, chosen deliberately to keep the floor
#                              low for older distributions
#
# So the floor decision and the dependency had already made opposite choices,
# and nothing noticed until something linked.
#
# §9 came within one step of this. It records that there is no prebuilt ONNX
# Runtime for Linux ARM and concludes "not a target, so not a problem today" —
# the right observation about the wrong two targets.
#
# **Shipping one target is the honest answer, not a retreat.** It is the only
# artifact that has ever been built and the only platform §12 tier 1 has ever
# passed on. Advertising three and delivering one would be exactly the
# half-wired shape this file already refuses Windows for.
#
# Getting the other two back is a real decision rather than a fix, because the
# only route that reaches all three is putting embeddings behind a cargo feature
# — which reopens a settled position. That is KB's, and it is recorded as a
# question rather than assumed here.
#
# **No Windows, unchanged.** It has never had CI coverage and the Claude Code
# hooks cannot run there, so shipping it would mean either a binary nobody has
# ever executed or a product that looks whole and is half-wired. It comes back
# when someone asks, with test coverage from the first commit (§10).
# **One again, and this time by choice rather than by failure** (KEEL-377).
#
# It went to three when `[package.metadata.dist] default-features = false` took
# the ONNX runtime out of the release build, so the `ort-sys` failures above
# stopped applying. The cost was that no released binary could search by
# meaning, and the trade was made blind: three platforms with keyword search
# looked better than one with both, because nobody knew who was on them.
#
# Nobody was. Across every release the other two archives were downloaded twice
# each, matching their `.sha256` counts exactly — the release process touching
# its own artifacts, not a person. arm64 was downloaded 14 times. So the list
# goes back to the one target that has ever been used, and `crates/specline/Cargo.toml`
# drops the line that was buying the other two.
#
# The `ort-sys` constraint above has still not gone away, and it is load-bearing
# again: adding a target here without solving it will fail the release at the
# link step. That is the right failure. The route that would reach all three is
# KEEL-349 — load the runtime at execution time instead of linking it — and it is
# open rather than done.
targets = ["aarch64-apple-darwin"]

# Shell only. There is no PowerShell installer because there is no Windows
# target, and shipping one would advertise a platform we do not build.
installers = ["shell"]

# Checksums are the point of the installer's integrity check, so they are
# explicit rather than left to a default that could move.
#
# **Setting this is not sufficient, and 0.1.2 is the proof.** It makes `dist`
# write a `.sha256` file beside each archive and record the digest in the
# manifest of the job that built it. The installer only carries that digest if
# the job that generates the installer can find those manifests: `dist` merges
# every `*dist-manifest.json` in `target/distrib` on startup, and fills in what
# it finds. The release workflow wrote none, so the installer shipped with no
# checksum in it, printed "no checksums to verify", and installed anyway — with
# this key set the whole time (KEEL-228). The build job now writes one per
# target, and `scripts/check-installer-checksums.sh` fails the release if the
# installer that comes out of it does not carry the digest of the archive being
# published.
checksum = "sha256"

# Build provenance, so a downloaded archive can be traced to the workflow run
# and commit that produced it (`gh attestation verify <file> --repo <owner>/specline`).
#
# Confirmed: `github_attestations`, and workspace-level only — `dist` warns and
# ignores it if it appears under `[package.metadata.dist]`, which is why it is
# here rather than beside the `dist = true` opt-ins.
#
# The attestation steps in `.github/workflows/release.yml` call
# `actions/attest-build-provenance` directly, so provenance does not depend on
# this key being honoured. Set anyway, so the config says what the release does.
github-attestations = true

# No updater binary beside the app. Specline does its own updating: §6 specifies
# `specline update`, which refuses to cross a schema version without asking and has
# `--rollback`. A second updater that knows nothing about the store would be a
# way to walk straight through that guard.
install-updater = false

# `.github/workflows/release.yml` is hand-written and must not be regenerated
# over. It carries a step `dist` does not know to emit — `npm ci` and
# `npm run build` for `apps/desktop`, whose output the daemon embeds (§3) — and
# a generated workflow would drop it, producing a daemon that starts, serves an
# empty site, and looks fine.
#
# The supported alternative, if the workflow is ever regenerated: a
# `github-build-setup` file (a YAML fragment path, relative to
# `.github/workflows/`, whose steps are spliced into the build job). It is not
# used here because it would be a third file, and because splicing steps into a
# job you cannot see is harder to reason about than owning the job.
#
# Confirmed, and load-bearing: with `allow-dirty = []` instead,
# `dist generate --check` fails with a 300-line diff proposing to replace this
# workflow with a generated one that has no Node steps in it. With `["ci"]` it
# is silent. That is the check the pre-commit path runs, so the spelling being
# right is the difference between the hand-written workflow being protected and
# nobody finding out until a regeneration.
allow-dirty = ["ci"]

# --- Two things left undecided on purpose -----------------------------------
#
# `install-path` is unset, so the shell installer uses its default of
# `CARGO_HOME` (`~/.cargo/bin`). PHASE-10 does not specify one, and the default
# is arguably wrong for Specline: §12 tier 1 runs the installer under
# `env -i PATH=/usr/bin:/bin` on a machine with no Rust, where creating
# `~/.cargo` says something untrue about how the binary got there. Changing it
# to `~/.keel/bin` is a decision for KB, not for this file.
#
# `unix-archive` is unset, so the default (`.tar.xz`) applies. The release
# workflow globs `*.tar.*` rather than a fixed extension so that changing this
# does not silently stop uploading the archives.

# --- The two frictions, now resolved ----------------------------------------
#
# Both were guesses when this file was written. `dist plan` settled them, and
# both were real.
#
# 1. **Installer name, and one installer rather than two.** `dist` names an
#    installer after the package that owns the binaries and treats every package
#    with binaries as its own app. With `keel-cli` and `keel-daemon` as separate
#    packages the plan produced `keel-cli-installer.sh` *and*
#    `keel-daemon-installer.sh` — two installers, while §1 advertised one
#    installer and `scripts/verify-release-tier1.sh` asserts that
#    running one leaves both binaries on disk.
#
#    There is no setting that folds one package's binaries into another's
#    archive; `binaries` is a per-platform override, not a manifest. So the
#    packages were merged: `keel-cli` is now `specline` (B-69) and declares both
#    binaries, with the daemon's entry point a shim over `specline_daemon::run`.
#    The plan now announces one app, `specline`, with `specline` and `specline-daemon` in
#    each of the three archives.
#
# 2. **`publish = false`.** Real, and it hid everything: `dist plan` refused the
#    whole workspace with "no packages in your workspace with distable
#    binaries". The opt-in is `[package.metadata.dist] dist = true`, per package,
#    with no workspace-level form — it is in `crates/specline/Cargo.toml`, and
#    `crates/specline-daemon/Cargo.toml` sets `dist = false` so that a binary added
#    back there fails the plan instead of quietly becoming a second installer.
#
# And the bugs from §10, now patched rather than only recorded. The generated
# installer has three ways to report a successful verification without having
# done one: no digest tool, no checksum embedded, and an empty checksum value.
# `scripts/patch-installer.sh` turns all three into refusals.
#
# The first is the one §10 found: the installer verifies a sha256 by calling
# `sha256sum`, and on a machine without it prints "skipping sha256 checksum
# verification" and returns *success*, so a corrupted archive installs.
#
# §10 says stock macOS has no `sha256sum`. Measured 2026-08-14, that is half
# right and the correction matters: current macOS ships `/sbin/sha256sum`, so
# with the default `PATH` the check runs. It skips on older macOS, and on any
# restricted `PATH` — including the `env -i PATH=/usr/bin:/bin` that §12 tier 1
# installs under, which is the tier the release gate leans on. `/usr/bin/shasum`
# is present in every one of those cases.
#
# `scripts/patch-installer.sh` rewrites the block to fall back to
# `shasum -a 256`, and refuses rather than skipping when neither command exists.
# The release workflow runs it after building the installer and *before*
# attesting, so provenance covers the bytes people download. It fails the
# release if the text it expects is not there, which is how a `dist` upgrade
# that fixes this upstream gets noticed instead of being papered over.
# `crates/specline/tests/installer_checksum.rs` is the proof, including a test that
# pins the unpatched behaviour so the patch can be deleted with evidence.
#
# The second is the one that actually reached a user, and it is worse: with no
# checksum embedded at all the installer says "no checksums to verify" and
# unpacks the archive. That branch is now a refusal too, because the installer
# should not depend on the release having been built correctly to be safe — and
# on 0.1.2 it was not. `crates/specline/tests/installer_embedded_checksums.rs`
# covers the other half, the release-time check that the digest in the installer
# is the digest of the archive being published.
